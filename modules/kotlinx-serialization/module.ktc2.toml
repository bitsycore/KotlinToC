name     = "kotlinx-serialization"
version  = "1.13.0"
upstream = ["core = org.jetbrains.kotlinx:kotlinx-serialization-core", "json = org.jetbrains.kotlinx:kotlinx-serialization-json"]
jvm      = ["org.jetbrains.kotlinx:kotlinx-serialization-core-jvm", "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm"]
files    = ["Ktc2Serialization.kt"]
# The encoders of one call share an array that the call holds.
weak     = ["kotlinx.serialization.json.internal.StreamingJsonEncoder.modeReuseCache"]
optIn    = ["kotlinx.serialization.InternalSerializationApi", "kotlinx.serialization.ExperimentalSerializationApi", "kotlinx.serialization.SealedSerializationApi", "kotlinx.serialization.internal.CoreFriendModuleApi", "kotlinx.serialization.json.internal.JsonFriendModuleApi", "kotlin.ExperimentalMultiplatform", "kotlin.ExperimentalSubclassOptIn", "kotlin.uuid.ExperimentalUuidApi", "kotlin.time.ExperimentalTime", "kotlin.reflect.ExperimentalAssociatedObjects", "kotlin.ExperimentalUnsignedTypes"]
