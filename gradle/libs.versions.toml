# Every version ktc2 pins, in one place: the Kotlin compiler it runs, and the libraries whose sources
# it compiles (the standard library with every program, the others as bundled modules). The rule
# (owner, 2026-11-15): the latest release of each, moved up when a new one comes out.
#
# Moving one up: change it here; for a library, check its files list (resources/ktc2/modules/<name>/files.txt)
# against the new sources, and take its tests again at the new tag (tests/README.md). Kotlin is more:
# the tests of the standard library are of its tag (tests/kotlin, v<kotlin>), and PhasedCompiler.kt
# calls the compiler's internals, to be gone over (CLAUDE.md, "Things that cost time before").

[versions]
# The Kotlin compiler (K2) ktc2 runs, and the standard library it compiles from source.
kotlin = "2.5.0-RC"
# Bundled modules, compiled from their own sources.
kotlinx-io = "0.9.3"
kotlinx-collections-immutable = "0.5.2"
atomicfu = "0.33.0"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.13.0"
# Only for the JVM side of kotlinx.serialization's own tests, which run a mode on okio (ktc2 has no okio module).
okio = "3.18.2"

[libraries]
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
# Only for its sources: they hold the part Kotlin/Native shares with Wasm (nativeWasmMain).
kotlin-stdlib-wasm-js = { module = "org.jetbrains.kotlin:kotlin-stdlib-wasm-js", version.ref = "kotlin" }
# The compiler plugin of kotlinx.serialization, run with ktc2's own: the serializers of @Serializable classes.
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization-compiler-plugin-embeddable", version.ref = "kotlin" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-io-bytestring = { module = "org.jetbrains.kotlinx:kotlinx-io-bytestring", version.ref = "kotlinx-io" }
kotlinx-io-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-io-core-jvm", version.ref = "kotlinx-io" }
kotlinx-io-bytestring-jvm = { module = "org.jetbrains.kotlinx:kotlinx-io-bytestring-jvm", version.ref = "kotlinx-io" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
kotlinx-collections-immutable-jvm = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable-jvm", version.ref = "kotlinx-collections-immutable" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
atomicfu-jvm = { module = "org.jetbrains.kotlinx:atomicfu-jvm", version.ref = "atomicfu" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json-jvm = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json-io = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-io", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json-io-jvm = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-io-jvm", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json-okio-jvm = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio-jvm", version.ref = "kotlinx-serialization" }
okio-jvm = { module = "com.squareup.okio:okio-jvm", version.ref = "okio" }
kotlinx-serialization-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-datetime-mingwx64 = { module = "org.jetbrains.kotlinx:kotlinx-datetime-mingwx64", version.ref = "kotlinx-datetime" }
kotlinx-datetime-jvm = { module = "org.jetbrains.kotlinx:kotlinx-datetime-jvm", version.ref = "kotlinx-datetime" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
