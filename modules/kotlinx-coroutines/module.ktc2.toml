name         = "kotlinx-coroutines"
version      = "1.11.0"
upstream     = [". = org.jetbrains.kotlinx:kotlinx-coroutines-core"]
jvm          = ["org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm"]
dependencies = ["atomicfu"]
# ktc2's own: the reaper of the jobs that ended with an exception (Ktc2Reaper.kt).
files        = ["Ktc2Reaper.kt", "commonMain/Ktc2Reaper.common.kt", "commonMain/channels/Ktc2Broadcast.kt"]
optIn        = ["kotlinx.coroutines.InternalCoroutinesApi", "kotlinx.coroutines.ExperimentalCoroutinesApi", "kotlinx.coroutines.DelicateCoroutinesApi", "kotlinx.cinterop.ExperimentalForeignApi", "kotlin.experimental.ExperimentalNativeApi", "kotlin.native.concurrent.ObsoleteWorkersApi", "kotlin.experimental.ExperimentalTypeInference", "kotlin.ExperimentalMultiplatform"]
edits        = ["nativeMain/MultithreadedDispatchers.kt = MultithreadedDispatchers.kt.edit", "commonMain/AbstractCoroutine.kt = AbstractCoroutine.kt.edit", "commonMain/JobSupport.kt = JobSupport.kt.edit", "concurrentMain/internal/LockFreeLinkedList.kt = LockFreeLinkedList.kt.edit", "commonMain/channels/Deprecated.kt = Deprecated.kt.edit", "commonMain/Builders.common.kt = Builders.common.kt.edit", "commonMain/channels/Broadcast.kt = Broadcast.kt.edit", "nativeMain/flow/internal/SafeCollector.kt = SafeCollector.kt.edit", "commonMain/channels/BufferedChannel.kt = BufferedChannel.kt.edit", "commonMain/flow/SharedFlow.kt = SharedFlow.kt.edit", "commonMain/flow/operators/Share.kt = Share.kt.edit", "commonMain/Await.kt = Await.kt.edit", "commonMain/sync/Mutex.kt = Mutex.kt.edit", "nativeMain/Builders.kt = Builders.native.kt.edit", "commonMain/internal/Scopes.kt = Scopes.kt.edit", "nativeMain/CoroutineContext.kt = CoroutineContext.native.kt.edit", "commonMain/intrinsics/Undispatched.kt = Undispatched.kt.edit", "commonMain/channels/BroadcastChannel.kt = BroadcastChannel.kt.edit"]
# A segment of a channel refers back to it; the channel is held by whoever sends or receives through the segment. A
# timeout's exception names its coroutine only for withTimeoutOrNull to know it, which holds that coroutine meanwhile.
# A broadcast channel's subscriptions reach it weakly: one that is all that holds it leaves it unreachable for sending.
# A select's clauses are reached only through it (its list, its state): their outer select is alive whenever one is used.
weak         = ["kotlinx.coroutines.channels.ChannelSegment._channel", "kotlinx.coroutines.TimeoutCancellationException.coroutine", "kotlinx.coroutines.selects.SelectImplementation.ClauseData.this$0", "kotlinx.coroutines.channels.Ktc2BroadcastReference.value"]
# A dispatched continuation keeps the cancellable continuation it made for reuse, which names it as its delegate: the
# two go together when the coroutine is done with them (its release() leaves the one kept for reuse in place).
# A coroutine that ends with an exception keeps it as its final state, and the exception names the coroutine: they go
# together when nothing else holds any of them.
# A dispatcher of workers starts them through a lambda of its pool that calls back into it: made once (Dispatchers.Default and
# IO), they go at the end of the program when no worker holds them any more.
# A job whose result is one of its own handlers (a DisposableHandle returned from its block) keeps it boxed as its state.
# A channel closed by the cancellation of the coroutine that sends to it keeps the exception, which names that coroutine.
# A flow aborted early (take, first) ends its collecting job with an exception that names that job.
# Two neighbouring segments of a channel or a semaphore name each other (_next, _prev): they go together when nothing else
# holds either (a channel or a semaphore let go of with two segments left).
cycles       = ["kotlinx.coroutines.internal.ConcurrentLinkedListNode._next -> kotlinx.coroutines.internal.ConcurrentLinkedListNode._prev", "kotlinx.coroutines.internal.DispatchedContinuation._reusableCancellableContinuation -> kotlinx.coroutines.CancellableContinuationImpl.delegate", "kotlinx.coroutines.JobSupport._state -> kotlinx.coroutines.CompletedExceptionally.cause -> kotlinx.coroutines.JobCancellationException.job", "kotlinx.coroutines.MultiWorkerDispatcher.workerPool -> kotlinx.coroutines.internal.OnDemandAllocatingPool.create -> lambda.self", "kotlinx.coroutines.JobSupport._state -> kotlinx.coroutines.IncompleteStateBox.state -> kotlinx.coroutines.JobNode.job", "kotlinx.coroutines.channels.BufferedChannel._closeCause -> kotlinx.coroutines.JobCancellationException.job -> kotlinx.coroutines.channels.ChannelCoroutine._channel", "kotlinx.coroutines.JobSupport._state -> kotlinx.coroutines.CompletedExceptionally.cause -> kotlinx.coroutines.flow.internal.AbortFlowException.owner"]
# The lists of a job's handlers are rings (a head, its nodes, the Removed that mark the nodes taken out): a ring that
# only its own objects hold is freed (another thread walking it holds one of them). Checked when its head goes.
rings        = ["kotlinx.coroutines.internal.LockFreeLinkedListHead: kotlinx.coroutines.internal.LockFreeLinkedListNode, kotlinx.coroutines.internal.Removed"]
