# The showcase: a window with a button for each group of tests; a click runs the group and
# adds everything it did to a log that can be scrolled. Several modules (this one, its tests in core/, a small library in
# shapes/), SDL3 fetched from GitHub and built by CMake.
#   ktc2 examples/showcase --run                 the window
#   ktc2 examples/showcase --run -- --auto       clicks every button by itself, then closes
#   ktc2 examples/showcase --run -- --headless   no window: the tests, printed
#   ktc2 examples/showcase --run -- --headless --log   the same, with every check and what it found
name         = "showcase"
executable   = "showcase"
main         = "showcase.app.start"
sources      = ["src"]
dependencies = ["core", "sdl3"]
