# The suite on each system. Then, each on machines of their own, every program again with
# AddressSanitizer on Linux and the C of every program again with MSVC on Windows, compared with
# what gcc's build printed: the suite's jobs hand them the C they generated.
name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: C compiler
        run: gcc --version
      - name: Suite
        run: ./gradlew test --rerun
        env:
          KTC2_TEST_VERBOSE: 1
          # A runner has 7 to 16 GB: each process takes about 1 GB.
          KTC2_TEST_FORKS: 3
      - name: Failures
        if: failure()
        run: python3 tools/failures.py || python tools/failures.py
      # The C of each program, how it is built and what it printed: for the jobs below.
      - name: Pack the generated C
        if: matrix.os != 'macos-latest'
        run: |
          cd build/integration
          for d in */; do for f in "${d}c" "${d}ktc2_build.txt" "${d}program.out"; do [ -e "$f" ] && echo "$f"; done; done > ../generated.txt
          tar -czf ../generated.tgz -T ../generated.txt
          ls -l ../generated.tgz
      - uses: actions/upload-artifact@v4
        if: matrix.os != 'macos-latest'
        with:
          name: generated-${{ matrix.os }}
          path: build/generated.tgz
          retention-days: 2

  asan:
    needs: suite
    # Also when another system's suite failed: Linux's C is there if Linux's suite passed.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-ubuntu-latest
          path: build
      - name: Unpack
        run: mkdir -p build/integration && tar -xzf build/generated.tgz -C build/integration
      - name: AddressSanitizer
        run: tools/asan_all.sh
        env:
          KTC2_SHARD: ${{ matrix.shard }}/3

  msvc:
    needs: suite
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-windows-latest
          path: build
      - name: Unpack
        shell: bash
        run: mkdir -p build/integration && tar -xzf build/generated.tgz -C build/integration
      - name: MSVC
        shell: cmd
        env:
          KTC2_SHARD: ${{ matrix.shard }}/2
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          "C:\Program Files\Git\bin\bash.exe" tools/msvc_all.sh
