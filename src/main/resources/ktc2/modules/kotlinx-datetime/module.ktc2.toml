# kotlinx-datetime for ktc2: kotlinx.datetime (LocalDate, LocalDateTime, TimeZone, formats), from
# the sources of kotlinx-datetime 0.8.0 as they are (files.txt lists them, with the systems each of
# those of the time zones is for; Gradle puts them next to this file). Its classes are serializable:
# it needs kotlinx-serialization's core.
name         = "kotlinx-datetime"
dependencies = ["kotlinx-serialization"]
# Windows' time zones are read from the registry: what windowsMain takes of <windows.h>.
files        = ["windows: datetime_win32.def", "windows: datetime_win32.h"]
