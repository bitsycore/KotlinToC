# Five machines at once, none waiting for another: the suite on Linux, macOS and Windows; every
# program again with AddressSanitizer on another Linux machine, which only translates them to C
# first; and on another Windows machine the C of every program built with MSVC, compared with
# what the program prints on the JVM (which that machine runs instead of gcc's build).
# Only two categories of the suite run here: the integration programs, compared with the JVM, and
# the Kotlin tests (tests/stdlib, tests/common), in C only: their assertions decide. The box tests
# and the libraries' own tests are run on the machines where the work is done.
name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: suite (Linux), os: ubuntu-latest, kind: suite, steps: "translate,jvm,c" }
          - { name: suite (macOS), os: macos-latest, kind: suite, steps: "translate,jvm,c" }
          - { name: suite (Windows), os: windows-latest, kind: suite, steps: "translate,jvm,c" }
          - { name: AddressSanitizer (Linux), os: ubuntu-latest, kind: asan, steps: "translate" }
          - { name: MSVC (Windows), os: windows-latest, kind: msvc, steps: "translate,jvm" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: C compiler
        run: gcc --version
      # The suite, or the part of it this machine needs (KTC2_TEST_STEPS, compiler/src/test/.../IntegrationTest.kt).
      - name: Suite
        run: ./gradlew :compiler:test --rerun
        env:
          KTC2_TEST_STEPS: ${{ matrix.steps }}
          KTC2_TEST_CATEGORIES: integration,kotlin
          KTC2_TEST_NO_JVM: kotlin
          # A runner has 7 to 16 GB: each process takes about 1 GB.
          KTC2_TEST_FORKS: 3
      - name: Failures
        if: failure()
        run: python3 tools/failures.py || python tools/failures.py
      - name: AddressSanitizer
        if: matrix.kind == 'asan'
        run: tools/asan_all.sh
      - name: MSVC
        if: matrix.kind == 'msvc'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          "C:\Program Files\Git\bin\bash.exe" tools/msvc_all.sh
