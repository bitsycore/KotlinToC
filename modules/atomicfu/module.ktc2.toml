# atomicfu for ktc2: kotlinx.atomicfu (atomic(), AtomicRef, locks, SynchronizedObject, parking),
# from the sources of atomicfu 0.33.0 as they are (files.txt lists them; Gradle puts them next to
# this file), and Ktc2Atomicfu.kt for what each system gives apart: a lock and a condition, in
# atomicfu.h over Win32 or pthreads.
name  = "atomicfu"
files = ["Ktc2Atomicfu.kt", "atomicfu.def", "atomicfu.h", "atomicfu_win32.h"]
# A mutex holds its queue of waiting threads and the queue its nodes, which are `inner` classes of
# the mutex: they refer back to it.
weak  = ["kotlinx.atomicfu.locks.NativeMutex.ParkingQueue.this$0", "kotlinx.atomicfu.locks.NativeMutex.Node.this$0"]
# What atomicfu's build opts every source set in to (buildSrc, kotlin-base-conventions).
optIn = ["kotlinx.cinterop.ExperimentalForeignApi", "kotlinx.atomicfu.locks.ExperimentalThreadBlockingApi"]
