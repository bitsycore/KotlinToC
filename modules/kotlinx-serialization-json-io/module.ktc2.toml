# JSON on the streams of kotlinx-io (Json.encodeToSink, decodeFromSource), from the sources of
# kotlinx-serialization-json-io 1.13.0 as they are (files.txt lists them;
# ktc2 fetches them, upstream below).
name         = "kotlinx-serialization-json-io"
version  = "1.13.0"
# Where the sources of the library come from: each directory and the source jar that fills it (Maven Central, at
# `version`). ktc2 fetches them into its cache the first time; files.txt lists those it compiles.
upstream = [". = org.jetbrains.kotlinx:kotlinx-serialization-json-io"]
# Its jars, for the JVM side of the suite (the programs and the library's own tests run there too).
jvm      = ["org.jetbrains.kotlinx:kotlinx-serialization-json-io-jvm", "org.jetbrains.kotlinx:kotlinx-serialization-json-okio-jvm", "com.squareup.okio:okio-jvm:3.18.2"]
dependencies = ["kotlinx-serialization", "kotlinx-io"]
optIn        = ["kotlinx.serialization.InternalSerializationApi", "kotlinx.serialization.ExperimentalSerializationApi", "kotlinx.serialization.json.internal.JsonFriendModuleApi", "kotlinx.io.unsafe.UnsafeIoApi"]
