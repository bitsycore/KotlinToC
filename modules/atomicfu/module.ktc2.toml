name     = "atomicfu"
version  = "0.33.0"
upstream = [". = org.jetbrains.kotlinx:atomicfu"]
jvm      = ["org.jetbrains.kotlinx:atomicfu-jvm"]
files    = ["Ktc2Atomicfu.kt", "Ktc2AtomicValues.kt", "atomicfu.def", "atomicfu.h", "atomicfu_win32.h"]
