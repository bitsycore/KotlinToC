# kotlinx.serialization for ktc2: its core (KSerializer, encoders and decoders, the built-in
# serializers, SerializersModule) and JSON (Json, JsonElement), from the sources of
# kotlinx-serialization-core and -json 1.13.0 as they are (files.txt lists them;
# ktc2 fetches them, upstream below). Classes marked @Serializable get their serializers from the compiler plugin,
# which ktc2 runs with its own when a program uses kotlinx.serialization.
name = "kotlinx-serialization"
version  = "1.13.0"
# Where the sources of the library come from: each directory and the source jar that fills it (Maven Central, at
# `version`). ktc2 fetches them into its cache the first time; files.txt lists those it compiles.
upstream = ["core = org.jetbrains.kotlinx:kotlinx-serialization-core", "json = org.jetbrains.kotlinx:kotlinx-serialization-json"]
# Its jars, for the JVM side of the suite (the programs and the library's own tests run there too).
jvm      = ["org.jetbrains.kotlinx:kotlinx-serialization-core-jvm", "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm"]
files = ["Ktc2Serialization.kt"]
# The encoders of one call to Json share an array of them, which each refers to: the call holds the array.
weak = ["kotlinx.serialization.json.internal.StreamingJsonEncoder.modeReuseCache"]
# What its build opts every source set in to (buildSrc, source-sets-conventions).
optIn = ["kotlinx.serialization.InternalSerializationApi", "kotlinx.serialization.ExperimentalSerializationApi", "kotlinx.serialization.SealedSerializationApi", "kotlinx.serialization.internal.CoreFriendModuleApi", "kotlinx.serialization.json.internal.JsonFriendModuleApi", "kotlin.ExperimentalMultiplatform", "kotlin.ExperimentalSubclassOptIn", "kotlin.uuid.ExperimentalUuidApi", "kotlin.time.ExperimentalTime", "kotlin.reflect.ExperimentalAssociatedObjects", "kotlin.ExperimentalUnsignedTypes"]
