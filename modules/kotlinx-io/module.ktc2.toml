name     = "kotlinx-io"
version  = "0.9.3"
upstream = ["core = org.jetbrains.kotlinx:kotlinx-io-core", "bytestring = org.jetbrains.kotlinx:kotlinx-io-bytestring"]
jvm      = ["org.jetbrains.kotlinx:kotlinx-io-core-jvm", "org.jetbrains.kotlinx:kotlinx-io-bytestring-jvm"]
files    = ["Ktc2KotlinxIo.kt", "Ktc2KotlinxIoFiles.kt", "kotlinxio.def", "kotlinxio.h", "kotlinxio_win32.h"]
# A segment is held by the one before it; the chain forward ends at the last.
weak     = ["kotlinx.io.Segment.prev"]
acyclic  = ["kotlinx.io.Segment.next"]
