# The suite on each system, and on Linux every program again with AddressSanitizer.
name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: C compiler
        run: gcc --version
      - name: Suite
        run: ./gradlew test --rerun
        env:
          KTC2_TEST_VERBOSE: 1
          # A runner has 7 to 16 GB: each process takes about 1 GB.
          KTC2_TEST_FORKS: 3
      - name: Failures
        if: failure()
        run: python3 tools/failures.py || python tools/failures.py
      - name: AddressSanitizer
        if: matrix.os == 'ubuntu-latest'
        run: tools/asan_all.sh
